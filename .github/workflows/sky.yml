name: Living scene

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      weather:
        description: "Pin the weather — clear/clouds/rain/snow/fog/storm. Blank uses the real forecast."
        required: false
        default: ""
      season:
        description: "Pin the season — spring/summer/autumn/winter. Blank uses today's date."
        required: false
        default: ""
      force:
        description: "Re-render even if the scene has not changed"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # looks up the weather, writes .github/scene-state and the seasonal footer.
      # The sky strip it also renders is gitignored: the weather is painted into
      # the header instead, by the step below.
      - uses: yuki4266/living-scene@v1
        id: scene
        with:
          lat: "35.99"          # Durham, NC
          lon: "-78.90"
          tz: America/New_York
          weather: ${{ inputs.weather }}
          season: ${{ inputs.season }}
          force: ${{ inputs.force }}
          commit: "false"

      - name: paint the weather into the header
        run: python3 .github/scene/bloom.py

      - name: commit if changed
        env:
          STATE: ${{ steps.scene.outputs.state }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-header.svg bloom-header-night.svg garden-footer.svg garden-footer-night.svg .github/scene-state
          if git diff --cached --quiet; then
            echo "scene unchanged ($STATE)"
            exit 0
          fi
          git commit -m "🌦 scene sync: $STATE"
          git pull --rebase origin main
          git push origin HEAD:main
