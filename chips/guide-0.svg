<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 512" width="860" height="512" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif"><title>AGENTS field guide</title>
<rect x="1" y="1" width="858" height="510" rx="14" fill="#7FA36B" fill-opacity="0.05" stroke="#7FA36B" stroke-opacity="0.4" stroke-width="1.2"/>
<g transform="translate(30,26)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/><circle cx="0" cy="-6.5" r="3.4" fill="#5E8B4F"/><circle cx="6.2" cy="-2" r="3.4" fill="#5E8B4F"/><circle cx="3.8" cy="5.3" r="3.4" fill="#5E8B4F"/><circle cx="-3.8" cy="5.3" r="3.4" fill="#5E8B4F"/><circle cx="-6.2" cy="-2" r="3.4" fill="#5E8B4F"/></g><circle r="2.8" fill="#5E8B4F"/></g>
<text x="48" y="30" font-size="11" letter-spacing="2" fill="#8b949e">AGENTS</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/><rect x="30" y="60" width="34" height="34" rx="9" fill="#E2542F" fill-opacity="0.12"/><g transform="translate(38,68) scale(0.75)"><path d="M13.85 0a4.16 4.16 0 0 0-2.95 1.217L1.456 10.66a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l9.442-9.442a2.49 2.49 0 0 1 3.541 0 2.49 2.49 0 0 1 0 3.541L8.59 12.97l-.1.1a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l.1-.098 7.03-7.034a2.49 2.49 0 0 1 3.542 0l.049.05a2.49 2.49 0 0 1 0 3.54l-8.54 8.54a1.96 1.96 0 0 0 0 2.755l1.753 1.753a.835.835 0 0 0 1.18 0 .835.835 0 0 0 0-1.18l-1.753-1.753a.266.266 0 0 1 0-.394l8.54-8.54a4.185 4.185 0 0 0 0-5.9l-.05-.05a4.16 4.16 0 0 0-2.95-1.218c-.2 0-.401.02-.6.048a4.17 4.17 0 0 0-1.17-3.552A4.16 4.16 0 0 0 13.85 0m0 3.333a.84.84 0 0 0-.59.245L6.275 10.56a4.186 4.186 0 0 0 0 5.902 4.186 4.186 0 0 0 5.902 0L19.16 9.48a.835.835 0 0 0 0-1.18.835.835 0 0 0-1.18 0l-6.985 6.984a2.49 2.49 0 0 1-3.54 0 2.49 2.49 0 0 1 0-3.54l6.983-6.985a.835.835 0 0 0 0-1.18.84.84 0 0 0-.59-.245" fill="#E2542F"/></g><text x="78" y="63" font-size="14" font-weight="700" fill="#E2542F">MCP</text><text x="78" y="81" font-size="13" fill="#8b949e">Model Context Protocol — the open standard that lets any model talk to any tool or data source through one interface. The</text><text x="78" y="98" font-size="13" fill="#8b949e">USB-C of AI 🔌</text><path d="M78 109 H 812" stroke="#E2542F" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.5s" fill="freeze"/><rect x="30" y="126" width="34" height="34" rx="9" fill="#F4795B" fill-opacity="0.12"/><text x="47" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#F4795B">A</text><text x="78" y="129" font-size="14" font-weight="700" fill="#F4795B">A2A</text><text x="78" y="147" font-size="13" fill="#8b949e">Agent2Agent — the open protocol, started by Google and now under the Linux Foundation, for agents to discover each</text><text x="78" y="164" font-size="13" fill="#8b949e">other via Agent Cards and hand tasks across vendors.</text><path d="M78 175 H 812" stroke="#F4795B" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.5s" fill="freeze"/><rect x="30" y="192" width="34" height="34" rx="9" fill="#ED8B66" fill-opacity="0.12"/><g transform="translate(38,200) scale(0.75)"><path d="m12 0 10.392 6v12L12 24 1.608 18V6Z" fill="#ED8B66"/></g><text x="78" y="195" font-size="14" font-weight="700" fill="#ED8B66">Agent Skills</text><text x="78" y="213" font-size="13" fill="#8b949e">Open standard for packaging know-how as folders of instructions, scripts and resources that an agent loads on demand —</text><text x="78" y="230" font-size="13" fill="#8b949e">portable across agent hosts.</text><path d="M78 241 H 812" stroke="#ED8B66" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.5s" fill="freeze"/><rect x="30" y="258" width="34" height="34" rx="9" fill="#7FA36B" fill-opacity="0.12"/><g transform="translate(38,266) scale(0.75)"><path d="M5 19H10A5 5 0 115 14ZM19 14A5 5 0 1114 19H19ZM10 5A5 5 0 105 10V5ZM19 5V10A5 5 0 1014 5Z" fill="#7FA36B"/></g><text x="78" y="261" font-size="14" font-weight="700" fill="#7FA36B">LangGraph</text><text x="78" y="279" font-size="13" fill="#8b949e">Graph-based agent orchestration: nodes are steps, edges are control flow, with built-in state, checkpointing and</text><text x="78" y="296" font-size="13" fill="#8b949e">human-in-the-loop support.</text><path d="M78 307 H 812" stroke="#7FA36B" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.5s" fill="freeze"/><rect x="30" y="324" width="34" height="34" rx="9" fill="#E2542F" fill-opacity="0.12"/><g transform="translate(38,332) scale(0.75)"><path d="m23.826 17.316-4.23-5.866-6.847-9.496c-.348-.48-1.151-.48-1.497 0l-6.845 9.494-4.233 5.868a.925.925 0 0 0 .46 1.417l11.078 3.626h.002a.92.92 0 0 0 .572 0h.002l11.077-3.626c.28-.092.5-.31.59-.592a.916.916 0 0 0-.13-.825h.002ZM12.001 4.07l4.44 6.158-4.152-1.36c-.032-.01-.066-.008-.098-.016a.8.8 0 0 0-.096-.016c-.032-.004-.062-.016-.094-.016s-.062.012-.094.016a.74.74 0 0 0-.096.016c-.032.006-.066.006-.096.016L7.59 10.221l-.026.008 4.44-6.158h-.002Zm-6.273 8.7 4.834-1.583.516-.168v9.19L2.41 17.372l3.317-4.6Zm7.197 7.437V11.02l5.35 1.752 3.316 4.598-8.666 2.838Z" fill="#E2542F"/></g><text x="78" y="327" font-size="14" font-weight="700" fill="#E2542F">Pydantic AI</text><text x="78" y="345" font-size="13" fill="#8b949e">Type-safe agent framework from the Pydantic team: schema-validated structured outputs, dependency injection for tools,</text><text x="78" y="362" font-size="13" fill="#8b949e">and model-agnostic runs with tracing built in.</text><path d="M78 373 H 812" stroke="#E2542F" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.5s" fill="freeze"/><rect x="30" y="390" width="34" height="34" rx="9" fill="#F4795B" fill-opacity="0.12"/><g transform="translate(38,398) scale(0.75)"><path d="M16.206 7.794C15.64 3.546 14.204 0 12 0 9.796 0 8.361 3.546 7.794 7.794 3.546 8.36 0 9.796 0 12c0 2.204 3.546 3.639 7.794 4.206C8.36 20.453 9.796 24 12 24c2.204 0 3.639-3.546 4.206-7.794C20.454 15.64 24 14.204 24 12c0-2.204-3.547-3.64-7.794-4.206Zm-8.55 7.174c-4.069-.587-6.44-1.932-6.44-2.969 0-1.036 2.372-2.381 6.44-2.969-.09.98-.137 1.98-.137 2.97 0 .99.047 1.99.137 2.968zM12 1.215c1.036 0 2.381 2.372 2.969 6.44a32.718 32.718 0 0 0-5.938 0c.587-4.068 1.932-6.44 2.969-6.44Zm4.344 13.753c-.2.03-1.022.126-1.23.146-.02.209-.117 1.03-.145 1.23-.588 4.068-1.933 6.44-2.97 6.44-1.036 0-2.38-2.372-2.968-6.44-.03-.2-.126-1.022-.147-1.23a31.833 31.833 0 0 1 0-6.23 31.813 31.813 0 0 1 7.46.146c4.068.587 6.442 1.933 6.442 2.969-.001 1.036-2.374 2.382-6.442 2.97z" fill="#F4795B"/></g><text x="78" y="393" font-size="14" font-weight="700" fill="#F4795B">Temporal</text><text x="78" y="411" font-size="13" fill="#8b949e">Durable execution: workflows survive crashes and restarts with their state intact — the backbone for long-running,</text><text x="78" y="428" font-size="13" fill="#8b949e">retry-heavy agent loops and human approvals.</text><path d="M78 439 H 812" stroke="#F4795B" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.69s" dur="0.5s" fill="freeze"/><rect x="30" y="456" width="34" height="34" rx="9" fill="#ED8B66" fill-opacity="0.12"/><g transform="translate(38,464) scale(0.75)"><path d="M23.996 7.462c-.056.837-.257 2.135-.716 3.85-.995 3.715-4.27 10.874-10.42 9.227-6.15-1.65-5.407-9.487-4.412-13.201.46-1.716.934-2.94 1.305-3.694.42-.853.846-.289 1.815.523.684.573 2.41 1.791 5.011 2.488 2.601.697 4.706.506 5.583.352 1.245-.219 1.897-.494 1.834.455Zm-9.807 3.863s-.127-1.819-1.773-2.286c-1.644-.467-2.613 1.04-2.613 1.04Zm4.058 4.539-7.769-2.172s.446 2.306 3.338 3.153c2.862.836 4.43-.98 4.43-.981Zm2.701-2.51s-.13-1.818-1.773-2.286c-1.644-.469-2.612 1.038-2.612 1.038ZM8.57 18.23c-4.749 1.279-7.261-4.224-8.021-7.08C.197 9.831.044 8.832.003 8.188c-.047-.73.455-.52 1.415-.354.677.118 2.3.261 4.308-.28a11.28 11.28 0 0 0 2.41-.956c-.058.197-.114.4-.17.61-.433 1.618-.827 4.055-.632 6.426-1.976.732-2.267 2.423-2.267 2.423l2.524-.715c.227 1.002.6 1.987 1.15 2.838a5.914 5.914 0 0 1-.171.049Zm-4.188-6.298c1.265-.333 1.363-1.631 1.363-1.631l-3.374.888s.745 1.076 2.01.743Z" fill="#ED8B66"/></g><text x="78" y="459" font-size="14" font-weight="700" fill="#ED8B66">Playwright</text><text x="78" y="477" font-size="13" fill="#8b949e">Browser automation from Microsoft: one API driving Chromium, Firefox and WebKit — the hands of browser-using agents</text><text x="78" y="494" font-size="13" fill="#8b949e">and the harness for end-to-end tests.</text></g>
</svg>
