<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 482" width="860" height="482" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif"><title>INFERENCE field guide</title>
<rect x="1" y="1" width="858" height="480" rx="14" fill="#F4795B" fill-opacity="0.04" stroke="#F4795B" stroke-opacity="0.35" stroke-width="1.2"/>
<g transform="translate(30,26)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/><circle cx="0" cy="-6.5" r="3.4" fill="#D98828"/><circle cx="6.2" cy="-2" r="3.4" fill="#D98828"/><circle cx="3.8" cy="5.3" r="3.4" fill="#D98828"/><circle cx="-3.8" cy="5.3" r="3.4" fill="#D98828"/><circle cx="-6.2" cy="-2" r="3.4" fill="#D98828"/></g><circle r="2.8" fill="#D98828"/></g>
<text x="48" y="30" font-size="11" letter-spacing="2" fill="#8b949e">INFERENCE</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/><g transform="translate(38,50) scale(0.8)"><path d="m23.6 0-8.721 4.59L9.829 24h7.41zM9.83 24V5.142H.4Z" fill="#E2542F"/></g><text x="76" y="58" font-size="13" font-weight="700" fill="#E2542F">vLLM</text><text x="76" y="75" font-size="12" fill="#8b949e">High-throughput inference engine built on PagedAttention and continuous batching — the de-facto standard for</text><text x="76" y="91" font-size="12" fill="#8b949e">serving open models in production 🚀</text><path d="M76 98 H 820" stroke="#E2542F" stroke-opacity="0.15" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.5s" fill="freeze"/><text x="76" y="120" font-size="13" font-weight="700" fill="#F4795B">SGLang</text><text x="76" y="137" font-size="12" fill="#8b949e">Fast serving engine from the LMSYS lineage: RadixAttention prefix caching and a structured-generation</text><text x="76" y="153" font-size="12" fill="#8b949e">frontend, trading blows with vLLM on throughput.</text><path d="M76 160 H 820" stroke="#F4795B" stroke-opacity="0.15" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.5s" fill="freeze"/><g transform="translate(38,174) scale(0.8)"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z" fill="#ED8B66"/></g><text x="76" y="182" font-size="13" font-weight="700" fill="#ED8B66">TensorRT-LLM</text><text x="76" y="199" font-size="12" fill="#8b949e">NVIDIA&#x27;s compiled inference stack: fused kernels, FP8/INT4 quantization, in-flight batching and speculative</text><text x="76" y="215" font-size="12" fill="#8b949e">decoding for the last drop of GPU throughput.</text><path d="M76 222 H 820" stroke="#ED8B66" stroke-opacity="0.15" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.5s" fill="freeze"/><text x="76" y="244" font-size="13" font-weight="700" fill="#7FA36B">llama.cpp</text><text x="76" y="261" font-size="12" fill="#8b949e">Pure C/C++ inference with GGUF quantization: runs models on CPUs, Apple silicon and phones, and is the</text><text x="76" y="277" font-size="12" fill="#8b949e">engine underneath Ollama, LM Studio and friends.</text><path d="M76 284 H 820" stroke="#7FA36B" stroke-opacity="0.15" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.5s" fill="freeze"/><text x="76" y="306" font-size="13" font-weight="700" fill="#E2542F">MLX</text><text x="76" y="323" font-size="12" fill="#8b949e">Apple&#x27;s array framework for Apple silicon: unified memory, lazy evaluation and mlx-lm for running and fine-</text><text x="76" y="339" font-size="12" fill="#8b949e">tuning models locally on a Mac 🍎</text><path d="M76 346 H 820" stroke="#E2542F" stroke-opacity="0.15" stroke-width="1"/></g>
