<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.5s" fill="freeze"/><rect x="30" y="192" width="34" height="34" rx="9" fill="#ED8B66" fill-opacity="0.12"/><text x="47" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#ED8B66">T</text><text x="78" y="195" font-size="14" font-weight="700" fill="#ED8B66">TRL</text><text x="78" y="213" font-size="13" fill="#8b949e">Transformer Reinforcement Learning: SFT, DPO, GRPO and reward-model trainers built on Transformers — the standard</text><text x="78" y="230" font-size="13" fill="#8b949e">toolkit for post-training open models.</text><path d="M78 241 H 812" stroke="#ED8B66" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.5s" fill="freeze"/><rect x="30" y="258" width="34" height="34" rx="9" fill="#7FA36B" fill-opacity="0.12"/><text x="47" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#7FA36B">V</text><text x="78" y="261" font-size="14" font-weight="700" fill="#7FA36B">verl</text><text x="78" y="279" font-size="13" fill="#8b949e">ByteDance&#x27;s RL training framework for LLMs: a hybrid-engine design that scales GRPO and PPO post-training across</text><text x="78" y="296" font-size="13" fill="#8b949e">GPU clusters, behind many reasoning-model releases.</text><path d="M78 307 H 812" stroke="#7FA36B" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.5s" fill="freeze"/><rect x="30" y="324" width="34" height="34" rx="9" fill="#E2542F" fill-opacity="0.12"/><text x="47" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#E2542F">U</text><text x="78" y="327" font-size="14" font-weight="700" fill="#E2542F">Unsloth</text><text x="78" y="345" font-size="13" fill="#8b949e">Hand-written Triton kernels that make LoRA and full fine-tunes about 2x faster with far less memory — a 70B fine-tune fits</text><text x="78" y="362" font-size="13" fill="#8b949e">on a single GPU.</text><path d="M78 373 H 812" stroke="#E2542F" stroke-opacity="0.18" stroke-width="1"/></g>
